services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: monitoring-app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - monitoring

    nginx:
        image: nginx:alpine
        container_name: monitoring-nginx
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - monitoring

    postgres:
        image: postgres:17-alpine
        container_name: monitoring-postgres
        environment:
            POSTGRES_DB: pulse
            POSTGRES_USER: pulse
            POSTGRES_PASSWORD: I2007f2007@
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - monitoring

    adminer:
        image: adminer:latest
        container_name: monitoring-adminer
        ports:
            - "8080:8080"
        depends_on:
            - postgres
        networks:
            - monitoring

    redis:
        image: redis:7-alpine
        container_name: monitoring-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - monitoring

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: monitoring-scheduler
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: php artisan schedule:work
        depends_on:
            - postgres
            - redis
        networks:
            - monitoring

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: monitoring-worker
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: php artisan queue:work redis --tries=1
        depends_on:
            - postgres
            - redis
        networks:
            - monitoring

networks:
    monitoring:

volumes:
    postgres_data:
    redis_data:
